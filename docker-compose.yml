# Shared local MongoDB for all seven components (database "marketplace").
#   Start:  docker compose up -d
#   Stop:   docker compose down          (data is kept in the "mongo_data" volume)
#   Wipe:   docker compose down -v       (deletes ALL data for every component)
#
# It listens on localhost only and has no username/password, so it is for local development only.
# The default settings of the app (mongodb://localhost:27017) already match this file.
services:
  mongodb:
    image: mongo:7.0
    container_name: marketplace-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
